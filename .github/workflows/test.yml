name: WebTrack Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Test Suite & Benchmarks
        run: node --test tests/aggregation.test.mjs tests/benchmarks.test.mjs tests/browser-compat.test.mjs tests/classifier.test.mjs tests/tracker.test.mjs tests/week-math.test.mjs
