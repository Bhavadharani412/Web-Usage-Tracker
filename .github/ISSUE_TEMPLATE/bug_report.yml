
name: Bug Report
description: Report a reproducible bug or unexpected behavior in WebTrack.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide enough detail to help us reproduce and investigate it.

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Clearly describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Open WebTrack.
        2. Switch to another tab.
        3. Observe the tracking results.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected Area
      options:
        - Active usage tracking
        - Idle detection
        - Tab or window switching
        - Domain classification
        - Usage analytics
        - Local storage or persistence
        - Tab cleanup
        - Popup or dashboard UI
        - Installation or permissions
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and Version
      placeholder: e.g. Google Chrome 130
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages or Logs
      description: Include relevant console errors, if available. Remove sensitive information.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add screenshots or other details that may help reproduce the issue.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed sensitive browsing data from logs and screenshots.
          required: true
