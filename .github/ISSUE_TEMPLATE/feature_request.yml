
name: Feature Request
description: Propose a feature or improvement for WebTrack.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggest a feature that solves a real problem. Explain who benefits and how the change should work.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation are you experiencing?
      placeholder: As a user, I find it difficult to...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches or workarounds?
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Tracking accuracy
        - Analytics and reports
        - Website classification
        - Tab management
        - Data export or import
        - User interface and accessibility
        - Performance
        - Privacy and security
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: expected_impact
    attributes:
      label: Expected Impact
      description: Who benefits, and how would this improve WebTrack?
    validations:
      required: true

  - type: textarea
    id: privacy_considerations
    attributes:
      label: Privacy and Data Considerations
      description: Would this feature change permissions, data collection, storage, or network access?
      placeholder: Explain any relevant privacy considerations.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add examples, mockups, screenshots, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I have described the problem this feature would solve.
          required: true
